name: Convert RTF Report to DOCX

on:
  push:
    paths:
      - 'trigger_docx.txt'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LibreOffice Writer
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer

      - name: Convert RTF to DOCX
        run: |
          mkdir -p converted
          libreoffice --headless --convert-to docx --outdir converted Laporan_UAS_Manajemen_Rantai_Pasok_CAMELIA.rtf
          cp converted/Laporan_UAS_Manajemen_Rantai_Pasok_CAMELIA.docx ./Laporan_UAS_Manajemen_Rantai_Pasok_CAMELIA.docx

      - name: Commit generated DOCX
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Laporan_UAS_Manajemen_Rantai_Pasok_CAMELIA.docx
          if ! git diff --cached --quiet; then
            git commit -m "Generate DOCX report from RTF"
            git push
          fi
